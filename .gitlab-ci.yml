stages:
  - build
  - deploy

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

build:
  stage: build
  image: docker:27
  tags:
    - docker

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

  script:
    - echo "========================================"
    - echo "Docker version"
    - echo "========================================"
    - docker version

    - echo "========================================"
    - echo "Docker login"
    - echo "========================================"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

    - echo "========================================"
    - echo "Docker build"
    - echo "========================================"
    - docker build -t "$IMAGE_TAG" .

    - echo "========================================"
    - echo "Docker push"
    - echo "========================================"
    - docker push "$IMAGE_TAG"

    - echo "========================================"
    - echo "BUILD SUCCESS"
    - echo "$IMAGE_TAG"
    - echo "========================================"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


deploy:
  stage: deploy
  image: alpine:3.20
  tags:
    - docker

  before_script:
    - apk add --no-cache openssh-client

  script:
    - echo "========================================"
    - echo "Configure SSH"
    - echo "========================================"

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

    - echo "========================================"
    - echo "Deploy"
    - echo "========================================"
    - echo "Image: $IMAGE_TAG"

    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        cd /opt/hello-world &&
        sed -i 's|^IMAGE=.*|IMAGE=$IMAGE_TAG|' .env &&
        docker compose pull &&
        docker compose up -d
      "

    - echo "========================================"
    - echo "DEPLOY SUCCESS"
    - echo "========================================"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
